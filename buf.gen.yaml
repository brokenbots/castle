version: v1
plugins:
  # Pin protobuf-es and connect-es to the v1 line so the generated TS stays
  # compatible with a single @bufbuild/protobuf + @connectrpc/connect version
  # set. Bump together when upgrading. Local plugin binaries avoid BSR rate
  # limits and keep CI deterministic.
  - plugin: es
    out: parapet/packages/run-viewer/src/gen
    opt:
      - target=ts
  - plugin: connect-es
    out: parapet/packages/run-viewer/src/gen
    opt:
      - target=ts
  # Go bindings for castle-owned surfaces (castle.v1, e.g. the human console
  # login service CRI-195). The criteria.v1 wire contract itself is generated
  # upstream — castle consumes the published criteria/sdk module (KB-102).
  - plugin: go
    out: castle/gen
    opt:
      - paths=source_relative
  - plugin: connect-go
    out: castle/gen
    opt:
      - paths=source_relative
