services:
  castle:
    build:
      context: .
      dockerfile: Dockerfile.castle
    environment:
      CASTLE_ADDR: :8080
      CASTLE_DB_PATH: /data/castle.db
    ports:
      - "8080:8080"
    volumes:
      - castle-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v0/overseers || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  overseer:
    build:
      context: .
      dockerfile: Dockerfile.overseer
    environment:
      OVERSEER_CASTLE_URL: http://castle:8080
      OVERSEER_WORKFLOW: /workflows/hello.hcl
      OVERSEER_NAME: compose-overseer
    depends_on:
      castle:
        condition: service_healthy
    restart: "no"

volumes:
  castle-data:
