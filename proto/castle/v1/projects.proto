// ProjectService — castle-owned project surface (KB-318). Projects are a
// first-class castle concept: agents register INTO a project, dispatch is
// restricted to the project's member set, and capability labels partition
// work only WITHIN the project pool. Upstream criteria deliberately does not
// ship a project entity, so this surface lives under the castle.v1 package
// and keeps the criteria.v1 wire contract an exact mirror of the released
// SDK.
syntax = "proto3";

package castle.v1;

import "google/protobuf/timestamp.proto";
import "criteria/v1/server.proto";

option go_package = "github.com/brokenbots/castle/castle/gen/castle/v1;castlev1";

service ProjectService {
  // CreateProject registers a new project. IDs are lowercase slugs; the
  // membership policy decides whether agents may self-join at registration
  // time (OPEN) or only via AddProjectMember (CLOSED).
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // GetProject returns one project record by id.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);

  // ListProjects returns all projects in id order.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // AddProjectMember admits a member (an agent operator or a human
  // operator) regardless of the project's membership policy. Self-joining a
  // CLOSED project through Register must fail; only this procedure admits
  // members into such a project.
  rpc AddProjectMember(AddProjectMemberRequest) returns (AddProjectMemberResponse);

  // RemoveProjectMember revokes a membership; removing an unknown member is
  // a no-op for idempotence.
  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (RemoveProjectMemberResponse);

  // ListProjectMembers returns the project's member set in member_id order.
  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse);

  // SubmitProjectAssignment queues a workflow assignment scoped to a
  // project: only members of the project will ever lease it. The response
  // shape mirrors criteria ServerService.SubmitWorkflowAssignment so
  // operators see identical semantics.
  //
  // input_values and target_metadata are workflow-generic conventions:
  // values are shape-validated only and NEVER interpreted by the server.
  rpc SubmitProjectAssignment(SubmitProjectAssignmentRequest) returns (SubmitProjectAssignmentResponse);

  // GetProjectSettings returns the project's ONE settings doc
  // (convention-keyed JSON entries) plus the doc's content-addressed etag.
  // The etag is what SetProjectSettings reconciles against.
  rpc GetProjectSettings(GetProjectSettingsRequest) returns (GetProjectSettingsResponse);

  // SetProjectSettings swaps the whole settings doc under optimistic etag
  // semantics: expected_etag must be the etag the caller last read, or ""
  // exactly when the doc is still unset. A writer whose expectation no
  // longer holds is rejected without clobbering; the response carries the
  // new etag to chain further swaps. The allow_anonymous_reads entry, if
  // present, must be a JSON boolean (see Project.settings) — any other
  // shape is rejected.
  rpc SetProjectSettings(SetProjectSettingsRequest) returns (SetProjectSettingsResponse);

  // GetProjectConfig returns the project's ONE workflow config record
  // (KB-339): per-project routes, workflow catalog entries, configLibrary
  // entries, the namespace binding payload, and castle-only digests, as
  // canonical JSON of a criteria.brokenbots.dev/v1
  // ProjectWorkflowConfig record (see confighome). The rendered
  // ConfigMap payloads derive FROM this record — castle is the config
  // home and a config edit here re-renders the namespace CMs.
  rpc GetProjectConfig(GetProjectConfigRequest) returns (GetProjectConfigResponse);

  // SetProjectConfig swaps the whole workflow config record under
  // optimistic etag semantics like SetProjectSettings: expected_etag must
  // be the etag the caller last read, or "" exactly when the record is
  // still unset. A writer whose expectation no longer holds is rejected
  // without clobbering; the response carries the new etag. The document
  // must parse and validate as a ProjectWorkflowConfig record
  // (fail-closed shape; values stay opaque).
  rpc SetProjectConfig(SetProjectConfigRequest) returns (SetProjectConfigResponse);

  // ListWorkflowCatalog lists a project's workflow catalog — the
  // workflowLibrary entries the record owns, resolved with the tree's
  // learning digest when castle has one — so consumers (parapet, route
  // editors) pick from the same records assignment validation consults.
  rpc ListWorkflowCatalog(ListWorkflowCatalogRequest) returns (ListWorkflowCatalogResponse);

  // GetRefirePolicy returns the policy row for (project_id, route) — the
  // exact key, not the engine's resolution ladder. The project-scoped
  // default row uses an empty route; the global default uses empty
  // project_id and route.
  rpc GetRefirePolicy(GetRefirePolicyRequest) returns (GetRefirePolicyResponse);

  // SetRefirePolicy upserts the policy row for (project_id, route) with
  // the same strict validation the policy file loader applies.
  rpc SetRefirePolicy(SetRefirePolicyRequest) returns (SetRefirePolicyResponse);
}

enum ProjectMembershipPolicy {
  PROJECT_MEMBERSHIP_POLICY_UNSPECIFIED = 0;
  // OPEN — agents may self-join the project at registration time.
  PROJECT_MEMBERSHIP_POLICY_OPEN = 1;
  // CLOSED — membership is granted only through AddProjectMember.
  PROJECT_MEMBERSHIP_POLICY_CLOSED = 2;
}

enum ProjectMemberKind {
  PROJECT_MEMBER_KIND_UNSPECIFIED = 0;
  // PROJECT_MEMBER_KIND_AI — an agent operator (automation that leases and
  // executes work).
  PROJECT_MEMBER_KIND_AI = 1;
  // PROJECT_MEMBER_KIND_HUMAN — a human operator (humans AND ai are both
  // operators of project work).
  PROJECT_MEMBER_KIND_HUMAN = 2;
}

message Project {
  // id is the project slug (lowercase id used across IDs, tickets, UIs).
  string id = 1;
  // membership_policy decides whether registration self-joins are allowed.
  ProjectMembershipPolicy membership_policy = 2;
  // default_refire_policy is the project-wide default for assignment
  // refiring behavior.
  string default_refire_policy = 3;
  // queues lists the project-owned queue names.
  repeated string queues = 4;
  // settings is a shape-validated key/value map owned by the project;
  // entries are convention-keyed JSON, an empty value meaning "entry
  // absent". Every key is opaque to the service EXCEPT
  // allow_anonymous_reads (KB-326): it is the ONE interpreted key, its
  // value must be a JSON boolean, and true lets anonymous callers read the
  // owning agent's legacy unscoped runs even with the global
  // --allow-anon-reads flag off. Project-scoped runs are never
  // anonymously readable.
  map<string, string> settings = 5;
  // info is an opaque, shape-validated key/value map with descriptive
  // project metadata.
  map<string, string> info = 6;
  // created_at is the project creation time.
  google.protobuf.Timestamp created_at = 7;
  // updated_at is the project's last update time.
  google.protobuf.Timestamp updated_at = 8;
}

message ProjectMember {
  // project_id of the membership row.
  string project_id = 1;
  // member_id is the agent operator or human operator identifier.
  string member_id = 2;
  // kind distinguishes ai operators from human operators.
  ProjectMemberKind kind = 3;
  // created_at is when the membership was recorded.
  google.protobuf.Timestamp created_at = 4;
}

message CreateProjectRequest {
  // project is the project to create; id and membership_policy are
  // required.
  Project project = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message AddProjectMemberRequest {
  // project_id of the project to extend.
  string project_id = 1;
  // member_id to admit.
  string member_id = 2;
  // kind for the membership (ai or human operator).
  ProjectMemberKind kind = 3;
}

message AddProjectMemberResponse {
  ProjectMember member = 1;
}

message RemoveProjectMemberRequest {
  string project_id = 1;
  string member_id = 2;
}

message RemoveProjectMemberResponse {}

message ListProjectMembersRequest {
  string project_id = 1;
}

message ListProjectMembersResponse {
  repeated ProjectMember members = 1;
}

message SubmitProjectAssignmentRequest {
  // project_id scopes the assignment to a project's member set.
  string project_id = 1;
  // workflow_name is the logical name of the workflow to execute.
  string workflow_name = 2;
  // workflow_source is the raw HCL/CHCL source for the workflow module.
  string workflow_source = 3;
  // lockfile_source is the optional raw HCL source of the workflow tree's
  // .criteria.lock.hcl.
  string lockfile_source = 4;
  // labels are optional capability key/value pairs; they partition eligible
  // agents WITHIN the project's pool.
  map<string, string> labels = 5;
  // idempotency_key is an optional opaque caller-provided identifier, scoped
  // per domain (the submitting project assignment owner).
  string idempotency_key = 6;
  // input_values are workflow input values (workflow-generic convention);
  // shape-validated only, persisted and delivered verbatim.
  map<string, string> input_values = 7;
  // target_metadata are environment hints, e.g. adapter.<kind>.image;
  // shape-validated only, persisted and delivered verbatim.
  map<string, string> target_metadata = 8;
}

message SubmitProjectAssignmentResponse {
  // run_id is the server-created run identifier. For idempotent replays this
  // is the run_id of the existing assignment.
  string run_id = 1;
  // state is the current assignment state (criteria vocabulary).
  criteria.v1.WorkflowAssignmentState state = 2;
  // created_at is the server time when the assignment was first recorded.
  google.protobuf.Timestamp created_at = 3;
  // When state == REJECTED, a human-readable reason for the rejection.
  string rejection_reason = 4;
  // When state == LEASED or TERMINAL, the criteria ID of the agent that
  // leased the assignment, if known.
  string leased_criteria_id = 5;
}

// RefirePolicy is the wire shape of the refire/classification policy
// document (KB-321): attempt budget, retry backoff floor, and the
// classification vocabularies (substring groups matched case-insensitively).
// max_attempts counts the original attempt (1 never refires; 0 disables
// refiring); backoff_seconds is the minimum delay between a failed
// attempt's end and the next family attempt.
message RefirePolicy {
  int32 max_attempts = 1;
  int32 backoff_seconds = 2;
  // transient are failure-reason substrings classifying the ending as a
  // recoverable stall: refired under the attempt/backoff limits.
  repeated string transient = 3;
  // parks are designed-park spellings: the parked run never refires and
  // waits for a human decision.
  repeated string parks = 4;
  // cosmetics are known-benign endings: stay terminal-failed, no action.
  repeated string cosmetics = 5;
}

message GetProjectSettingsRequest {
  string project_id = 1;
}

message GetProjectSettingsResponse {
  // settings is the convention-keyed settings doc; empty entries list means
  // the doc is unset.
  map<string, string> settings = 1;
  // etag is the doc's content-addressed etag (empty when the doc is
  // unset).
  string etag = 2;
}

message SetProjectSettingsRequest {
  string project_id = 1;
  // settings is the complete replacement doc — settings are swapped whole,
  // never merged.
  map<string, string> settings = 2;
  // expected_etag is the etag the caller last read: the current etag, or ""
  // exactly when the doc is still unset.
  string expected_etag = 3;
}

message SetProjectSettingsResponse {
  string etag = 1;
}

message GetProjectConfigRequest {
  string project_id = 1;
}

message GetProjectConfigResponse {
  // document is the canonical JSON of the project's workflow config
  // record; empty when the record is unset.
  bytes document = 1;
  // etag is the record's content-addressed etag (empty when the record
  // is unset).
  string etag = 2;
}

message SetProjectConfigRequest {
  string project_id = 1;
  // document is the complete replacement record — config is swapped
  // whole, never merged. Canonical JSON of a ProjectWorkflowConfig
  // record; the server validates shape fail-closed and stores the
  // canonical form.
  bytes document = 2;
  // expected_etag is the etag the caller last read: the current etag, or
  // "" exactly when the record is still unset.
  string expected_etag = 3;
}

message SetProjectConfigResponse {
  string etag = 1;
}

// WorkflowCatalogEntry is one workflowLibrary entry of the project's
// workflow config record as the catalog list presents it (KB-339): the
// workflow identity (type, and for url trees the url+ref+digest) plus the
// execution placement (namespace/class/image) and the declared interface
// name when the tree carries one.
message WorkflowCatalogEntry {
  // name is the catalog entry name (the workflowLibrary key).
  string name = 1;
  // type is "image" or "url".
  string type = 2;
  // url and ref identify a url-type tree. image-type entries carry the
  // image.
  string url = 3;
  string ref = 4;
  // digest is the tree content digest castle has learned for url+ref
  // (KB-310 bookkeeping; "" when none is learned).
  string digest = 5;
  // namespace, class and image are the execution placement fields.
  string namespace = 6;
  string class = 7;
  string image = 8;
  // interface_name is the declared interface's workflow name when the
  // tree carries an interface declaration.
  string interface_name = 9;
}

message ListWorkflowCatalogRequest {
  string project_id = 1;
}

message ListWorkflowCatalogResponse {
  repeated WorkflowCatalogEntry entries = 1;
  // etag is the workflow config record's content-addressed etag (empty
  // when the record is unset) — callers use it as the config cache
  // handle for the listing they just read.
  string etag = 2;
}

message GetRefirePolicyRequest {
  // project_id of the policy row ("" selects the global default slot).
  string project_id = 1;
  // route of the policy row ("" selects the project-scoped default).
  string route = 2;
}

message GetRefirePolicyResponse {
  RefirePolicy policy = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message SetRefirePolicyRequest {
  string project_id = 1;
  string route = 2;
  RefirePolicy policy = 3;
}

message SetRefirePolicyResponse {
  google.protobuf.Timestamp updated_at = 1;
}
