// ServerService — read/control RPCs served by the server and consumed by UI clients
// (and any human tooling such as grpcurl).
syntax = "proto3";

package criteria.v1;

import "google/protobuf/timestamp.proto";
import "criteria/v1/events.proto";
import "criteria/v1/criteria.proto";

option go_package = "github.com/brokenbots/criteria/sdk/pb/criteria/v1;criteriav1";

service ServerService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (Agent);

  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (Run);

  // ListRunEvents replaces the Phase 0 run-events HTTP endpoint.
  rpc ListRunEvents(ListRunEventsRequest) returns (ListRunEventsResponse);

  // WatchRun replaces the Phase 0 run-stream endpoint. Emits any already
  // persisted events (since `since_seq`) and then tails live events until the
  // client disconnects or the run reaches a terminal state.
  rpc WatchRun(WatchRunRequest) returns (stream Envelope);

  // StopRun cancels a run. If an agent is attached to the run via its
  // Control stream, the orchestrator pushes a RunCancel to it. Returns
  // FAILED_PRECONDITION if the agent is not connected.
  //
  // Implementations MUST reject the request with PERMISSION_DENIED if the
  // authenticated caller does not own the target run's agent.
  rpc StopRun(StopRunRequest) returns (StopRunResponse);

  // PauseRun halts a run without losing state. The adapter session is
  // paused via the v2 adapter Pause RPC.
  rpc PauseRun(PauseRunRequest) returns (PauseRunResponse);

  // ResumeRun continues a previously paused run.
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);

  // InspectRun returns structured read-only state for a run. If session_id
  // is empty the server may return a summary across all sessions.
  rpc InspectRun(InspectRunRequest) returns (InspectRunResponse);

  // SubmitWorkflowAssignment enqueues a workflow for execution by a long-lived
  // Criteria agent. The orchestrator creates the run, records the assignment,
  // and returns the run id along with the current assignment state.
  //
  // Authorization: implementations MUST authenticate the caller. The
  // assignment record is owned by the authenticated submitting caller;
  // callers are permitted to inspect or cancel assignments they own.
  // Implementations MAY additionally enforce service-level authorization
  // (namespace, role, or policy checks). The run itself executes on the
  // agent that later leases the assignment, but ownership of the assignment
  // record remains with the submitting caller.
  //
  // Idempotency: if `idempotency_key` is non-empty and a previous submission
  // with the same key already exists in the caller's scope, the server MUST
  // return the existing `run_id` and current state without creating a
  // duplicate run or assignment.
  rpc SubmitWorkflowAssignment(SubmitWorkflowAssignmentRequest) returns (SubmitWorkflowAssignmentResponse);

  // GetAssignmentDisposition returns the current queue state of a previously
  // submitted workflow assignment.
  //
  // Authorization: implementations MUST reject the request with
  // PERMISSION_DENIED if the authenticated caller does not own the assignment.
  // Run ownership is distinct from assignment ownership: agents lease and
  // execute runs via the Control stream, but the assignment record remains
  // owned by the submitting caller.
  rpc GetAssignmentDisposition(GetAssignmentDispositionRequest) returns (GetAssignmentDispositionResponse);

  // SendPrompt — schema-only stub for Phase 2.3. UI clients can wire up
  // against this method, but the server currently returns UNIMPLEMENTED.
  rpc SendPrompt(SendPromptRequest) returns (SendPromptResponse);
}

// --- Agent read types ---

message Agent {
  string criteria_id = 1;
  string name = 2;
  map<string, string> labels = 3;
  string status = 4; // "online" | "offline"
  google.protobuf.Timestamp registered_at = 5;
  google.protobuf.Timestamp last_seen_at = 6;
}

message ListAgentsRequest {
  int32 limit = 1;
  string page_token = 2;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
}

message GetAgentRequest {
  string criteria_id = 1;
}

// --- Run read types ---

message ListRunsRequest {
  string criteria_id = 1; // optional filter
  string status = 2;      // optional filter
  int32 limit = 3;
  string page_token = 4;
}

message ListRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}

message GetRunRequest {
  string run_id = 1;
}

// --- Event read/watch types ---

message ListRunEventsRequest {
  string run_id = 1;
  uint64 since_seq = 2; // exclusive
  int32 limit = 3;
}

message ListRunEventsResponse {
  repeated Envelope events = 1;
  uint64 last_seq = 2;
  // Continuation cursor. When set, pass this as since_seq in the next call.
  uint64 next_since_seq = 3;
}

message WatchRunRequest {
  string run_id = 1;
  uint64 since_seq = 2; // exclusive; 0 streams from the beginning
  string subscriber_id = 3; // optional durable cursor key scoped by run_id
}

// --- Run control types ---

message StopRunRequest {
  string run_id = 1;
  string reason = 2;
}

message StopRunResponse {
  // ServerTime when the cancel was issued; the run may still take time to
  // observe and react to the cancel.
  google.protobuf.Timestamp issued_at = 1;
}

// --- Pause / Resume / Inspect types ---

message PauseRunRequest {
  string run_id = 1;
}

message PauseRunResponse {
  google.protobuf.Timestamp issued_at = 1;
}

message ResumeRunRequest {
  string run_id = 1;
}

message ResumeRunResponse {
  google.protobuf.Timestamp issued_at = 1;
}

message InspectRunRequest {
  string run_id = 1;
  string session_id = 2; // optional; if empty the server may return a summary
}

message InspectRunResponse {
  string run_id = 1;
  string session_id = 2;
  string adapter = 3;
  string current_step = 4;
  int64 pending_permissions = 5;
  google.protobuf.Timestamp last_activity_at = 6;
  // Opaque adapter state — the host pretty-prints any well-formed JSON.
  string state_json = 7;
}

message SendPromptRequest {
  string run_id = 1;
  string step = 2;
  string prompt = 3;
}

message SendPromptResponse {
  google.protobuf.Timestamp issued_at = 1;
}

// WorkflowAssignmentState enumerates the possible states of an operator-
// submitted workflow assignment. The assignment lifecycle is independent of
// the run lifecycle: an assignment moves through queued -> leased, and may
// end in terminal or rejected. The run itself progresses via events on the
// agent Control stream.
enum WorkflowAssignmentState {
  WORKFLOW_ASSIGNMENT_STATE_UNSPECIFIED = 0;
  // QUEUED — the assignment is waiting for an agent to lease it.
  WORKFLOW_ASSIGNMENT_STATE_QUEUED = 1;
  // LEASED — an agent has leased the assignment and is executing the run.
  // This state covers both "leased" and "running" from the operator
  // perspective.
  WORKFLOW_ASSIGNMENT_STATE_LEASED = 2;
  // TERMINAL — the run reached a terminal state, or the assignment was
  // accepted and later ended (completed, failed, cancelled). The assignment
  // is no longer active.
  WORKFLOW_ASSIGNMENT_STATE_TERMINAL = 3;
  // REJECTED — the assignment was rejected immediately upon submission
  // (invalid source, no matching agent, policy failure, etc.). No run was
  // created.
  WORKFLOW_ASSIGNMENT_STATE_REJECTED = 4;
}

message SubmitWorkflowAssignmentRequest {
  // workflow_name is the logical name of the workflow to execute.
  string workflow_name = 1;
  // workflow_source is the raw HCL/CHCL source for the workflow module.
  string workflow_source = 2;
  // lockfile_source is the optional raw HCL source of the workflow tree's
  // .criteria.lock.hcl. When present the agent writes it next to the
  // workflow source so adapter pins and digests are available during
  // compilation.
  string lockfile_source = 3;
  // labels are optional key/value pairs used for routing/matching the
  // assignment to an agent. They are also passed through to the executing
  // agent.
  map<string, string> labels = 4;
  // idempotency_key is an optional opaque caller-provided identifier. When
  // non-empty, duplicate submissions with the same key in the same caller
  // scope MUST return the existing run_id and current state without creating
  // a duplicate run or assignment.
  string idempotency_key = 5;
}

message SubmitWorkflowAssignmentResponse {
  // run_id is the server-created run identifier. For idempotent replays this
  // is the run_id of the existing assignment.
  string run_id = 1;
  // state is the current assignment state.
  WorkflowAssignmentState state = 2;
  // created_at is the server time when the assignment was first recorded.
  google.protobuf.Timestamp created_at = 3;
  // When state == REJECTED, a human-readable reason for the rejection.
  string rejection_reason = 4;
  // When state == LEASED or TERMINAL, the criteria ID of the agent that
  // leased the assignment, if known.
  string leased_criteria_id = 5;
}

message GetAssignmentDispositionRequest {
  // run_id is the server-created run identifier returned by
  // SubmitWorkflowAssignment.
  string run_id = 1;
}

message GetAssignmentDispositionResponse {
  // run_id is the server-created run identifier.
  string run_id = 1;
  // state is the current assignment state.
  WorkflowAssignmentState state = 2;
  // created_at is the server time when the assignment was first recorded.
  google.protobuf.Timestamp created_at = 3;
  // updated_at is the server time of the last assignment state change.
  google.protobuf.Timestamp updated_at = 4;
  // When state == REJECTED, a human-readable reason for the rejection.
  string rejection_reason = 5;
  // When state == LEASED or TERMINAL, the criteria ID of the agent that
  // leased the assignment, if known.
  string leased_criteria_id = 6;
}
