name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parapet/package-lock.json
      - run: npm ci
        working-directory: parapet
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - run: make proto-lint
      - run: make proto-check-drift

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      # The pg-backed tests boot the embedded-postgres binary (pinned
      # 18.3.0). Cache the archive so parallel test binaries never race
      # the 15MB Maven download; on a cold cache exactly one fetch warms
      # it before any test binary starts.
      - uses: actions/cache@v4
        id: pgbin
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}-18.3.0
      - run: go run ./internal/store/pg/pgtest/embedcache
        if: steps.pgbin.outputs.cache-hit != 'true'
        working-directory: castle
      - run: cd castle && go test -race ./...

  parapet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parapet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parapet/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:run
