name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parapet/package-lock.json
      - run: npm ci
        working-directory: parapet
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - run: make proto-lint
      - run: make proto-check-drift

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: cd castle && go test -race ./...

  parapet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parapet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parapet/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:run
