name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint

      - name: buf breaking (vs base)
        if: github.event_name == 'pull_request'
        run: |
          # Skip gracefully on the bootstrap PR that first introduces the
          # proto module: buf reports "Module had no .proto files" when the
          # base branch does not yet contain any .proto files. Once the
          # schema lands on the base branch this becomes a hard check.
          set +e
          out=$(buf breaking --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}" 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -q 'had no .proto files'; then
              echo "::notice::Base branch has no proto schema yet; skipping breaking check."
              exit 0
            fi
            exit $code
          fi

      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --quiet -- shared/pb parapet/src/gen; then
            echo "::error::Generated proto output is out of date. Run 'make proto' and commit."
            git --no-pager diff --stat -- shared/pb parapet/src/gen
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Run Go tests
        run: make test

      - name: Validate workflows
        run: make validate

  parapet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parapet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: parapet/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  integration:
    runs-on: ubuntu-latest
    needs: go
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Build binaries
        run: make build-castle build-overseer plugins

      - name: Run integration tests
        run: make test-integration

      - name: Upload process logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.run_id }}
          path: /tmp/castle-*.log
          if-no-files-found: ignore
